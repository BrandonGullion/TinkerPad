[package]
name = "tinkerpad-plugin"
description = "plugin.toml schema and loader, plugin discovery, toolchain probing, helper protocol client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tinkerpad-core.workspace = true
tinkerpad-process.workspace = true
bytes.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex = "1"
serde_json = "1"
tokio = { workspace = true, features = ["time", "macros", "rt-multi-thread", "sync"] }
base64 = "0.22"
# The manifest reference and `plugin.toml`'s JSON Schema are generated from
# these types rather than written beside them (work item 05-04).
schemars = "0.9"

[lints]
workspace = true

# Stand-in toolchain for the probe tests. Not part of the app.
[[bin]]
name = "tinkerpad-fakeprobe"
path = "src/bin/fakeprobe.rs"

# Stand-in plugin helper for the protocol tests. Not part of the app.
[[bin]]
name = "tinkerpad-fakehelper"
path = "src/bin/fakehelper.rs"

# Generates docs/reference/ from the types (work item 05-04). Not part of the
# app; CI runs it with --check.
[[bin]]
name = "tinkerpad-docgen"
path = "src/bin/docgen.rs"

[dev-dependencies]
tinkerpad-library.workspace = true
