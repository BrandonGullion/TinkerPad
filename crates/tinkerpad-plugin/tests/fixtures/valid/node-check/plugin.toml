api = 1

# A plugin whose toolchain is Node, used by the in-app "toolchains" self-test
# to check a real probe succeeds through the discovered PATH.

[language]
id = "node-check"
name = "Node check"
extension = "njs"

[toolchain]
probe = [{ command = "node", args = ["--version"], min_version = "18" }]
install_hint = "Install Node.js from https://nodejs.org"

[[kind]]
id = "script"
name = "Script"
template = "main.js"
default = true

# Locked lines: the prelude and postlude are part of the file and read-only in
# the editor. The self-tests use this kind to exercise locking.
[[kind]]
id = "expression"
name = "Expression"
template = "expression.js"
prelude = "console.log(\n"
postlude = "\n);\n"

[lsp]
# A tiny server in server.js, so the self-tests have one on every machine
# (and in CI) without installing anything. Rooted at the library, which means
# it can be pre-warmed: there is nothing playground-specific about it.
command = "node"
args = ["{plugin_dir}/server.js"]
workspace = "library_root"
idle_shutdown = "never"

[run]
command = "{toolchain}"
args = ["{main}"]

[helper]
# A warm runner in helper.js, so the self-tests have one on every machine (and
# in CI) without installing anything. Built on first use by build.js, which
# stands in for a real compile step.
command = "node"
args = ["{plugin_dir}/helper.js"]
hooks = ["run"]
idle_shutdown = "never"

[helper.build]
command = "node"
args = ["{plugin_dir}/build.js", "{scratch}"]
