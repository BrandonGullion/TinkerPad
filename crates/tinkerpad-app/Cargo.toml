[package]
name = "tinkerpad-app"
description = "The TinkerPad desktop application (Tauri shell, commands, event bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tinkerpad"
path = "src/main.rs"

[dependencies]
tinkerpad-core.workspace = true
tinkerpad-process.workspace = true
tinkerpad-plugin.workspace = true
tinkerpad-lsp.workspace = true
tinkerpad-runner.workspace = true
tinkerpad-library.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { workspace = true, features = ["derive"] }
tracing-appender = "0.2"
tauri-plugin-opener = "2"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "tinkerpad_app"
path = "src/lib.rs"
