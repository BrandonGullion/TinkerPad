[package]
name = "tinkerpad-app"
description = "The TinkerPad desktop application (Tauri shell, commands, event bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# There is more than one binary here (the test stand-in below), so `cargo run`
# and `tauri dev` need telling which one is the app.
default-run = "tinkerpad"

[[bin]]
name = "tinkerpad"
path = "src/main.rs"

# Stand-in package manager for the tool-acquisition tests (work item 04-08a).
# Not part of the app.
[[bin]]
name = "tinkerpad-faketool"
path = "src/bin/faketool.rs"

[dependencies]
tinkerpad-core.workspace = true
tinkerpad-process.workspace = true
tinkerpad-plugin.workspace = true
tinkerpad-lsp.workspace = true
tinkerpad-runner.workspace = true
tinkerpad-library.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing-appender = "0.2"
tauri-plugin-opener = "2"
# Updates from GitHub releases, checked once the window is up (work item 04-06).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
toml.workspace = true
# Saving settings edits the file in place, so comments and anything a newer
# build wrote survive (work item 04-02).
toml_edit = "0.22"
# Watching settings.toml, the same way the library watches its folder.
notify = "8"
notify-debouncer-mini = "0.7.0"
# Getting a language's tools (work item 04-08a): fetch, verify, unpack. All
# five already arrive with tauri-plugin-updater, so these are direct edges to
# crates the build already has rather than new dependencies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "tinkerpad_app"
path = "src/lib.rs"
