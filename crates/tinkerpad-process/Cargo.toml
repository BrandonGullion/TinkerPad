[package]
name = "tinkerpad-process"
description = "Child process supervision: spawn, stream, kill trees, die-with-parent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tinkerpad-core.workspace = true
tokio.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tiny helper program used by the integration tests so the same tests run on
# every platform without shell scripts. Not part of the app.
[[bin]]
name = "tinkerpad-testchild"
path = "src/bin/testchild.rs"

[[bin]]
name = "tinkerpad-testparent"
path = "src/bin/testparent.rs"

[lints]
workspace = true
