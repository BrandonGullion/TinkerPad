api = 1

# Rust with Cargo. Each playground is a real crate. See README.md.

[language]
id = "rust"
name = "Rust"
extension = "rs"
highlighter = "rust"
main_path = "src/main.rs"

[toolchain]
# Edition 2024 needs Rust 1.85.
probe = [{ command = "cargo", args = ["--version"], min_version = "1.85" }]
install_hint = "Install Rust with rustup: https://rustup.rs"

[[kind]]
id = "program"
name = "Rust Program"
template = "program.rs"
default = true

# Locked lines: main() dumps the one expression in between.
[[kind]]
id = "expression"
name = "Rust Expression"
template = "expression.rs"
prelude = "fn main() {\n    tinkerpad::dump(&(\n"
postlude = "\n    ));\n}\n"

[scaffold]
# Absolute paths are written at creation: the dump crate in this folder, and a
# target folder shared by every Rust playground. Both are also recorded in
# playground.toml under [plugin.rust].
files = [
  { path = "Cargo.toml", template = "Cargo.toml" },
  { path = ".cargo/config.toml", template = "cargo-config.toml" },
]

[run]
command = "{toolchain}"
args = ["run", "--quiet"]
cwd = "{dir}"
# The output pane shows plain text.
env = { CARGO_TERM_COLOR = "never" }

[lsp]
# rust-analyzer ships with rustup ("rustup component add rust-analyzer").
# One server for every Rust playground, rooted at a folder of TinkerPad's own
# rather than any playground. The playgrounds are named through [lsp.register]
# below, so opening another one adds it without a restart.
command = "rust-analyzer"
workspace = "scratch_workspace"

[lsp.acquire]
# rustup owns rust-analyzer, and its shims are already on the PATH of anyone
# who has Rust, so there is nowhere better to put it (work item 04-08b).
kind = "command"
command = ["rustup", "component", "add", "rust-analyzer"]
needs = "rustup"
label = "rustup component add rust-analyzer"

[lsp.register]
# Each open playground adds its crate to the server's linkedProjects, which is
# how rust-analyzer serves several unrelated crates from one process.
setting = "rust-analyzer.linkedProjects"
value = "{dir}/Cargo.toml"
# rust-analyzer reads its projects when told to, not on every config change.
reload = "rust-analyzer/reloadWorkspace"

[lsp.init_options]
# A playground is a scratch crate. Build scripts and proc macros are worth the
# wait for useful completions; a background check is not, since it would fight
# the run button over the shared target folder.
#
# targetDir keeps rust-analyzer out of that folder entirely: without it, the
# server and the run button take turns holding cargo's lock, and a server that
# loses the race reports "failed to fetch workspace" and serves nothing.
cargo = { buildScripts = { enable = true }, targetDir = "analyzer-target" }
checkOnSave = false
procMacro = { enable = true }

[deps]
kind = "command"
add = ["cargo", "add", "{name}@{version}"]

[output]
# error[E0308]: mismatched types
#  --> src/main.rs:3:9
error_regex = '(?m)^(?<severity>error|warning)(?:\[[A-Z]\d+\])?: (?<message>.+)\n\s*--> (?<file>.+?):(?<line>\d+):(?<col>\d+)$'
error_regex_multiline = true
