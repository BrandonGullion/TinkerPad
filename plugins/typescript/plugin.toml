api = 1

# TypeScript and JavaScript on Node. See README.md.

[language]
id = "typescript"
name = "TypeScript"
extension = "ts"
highlighter = "typescript"

[toolchain]
# --experimental-transform-types arrived in Node 22.7.
probe = [{ command = "node", args = ["--version"], min_version = "22.7" }]
install_hint = "Install Node.js 22.7 or newer (the current LTS is best): https://nodejs.org"

[[kind]]
id = "statements"
name = "TypeScript Statements"
template = "statements.ts"
default = true

[[kind]]
id = "program"
name = "TypeScript Program"
template = "program.ts"

[scaffold]
# `"type": "module"` makes main.ts an ES module without Node guessing (and
# warning about it when some folder above has a package.json). "Add package"
# installs beside it, into the playground's own node_modules.
files = [{ path = "package.json", template = "package.json" }]

[lsp]
# Needs typescript-language-server on PATH:
#   npm install -g typescript-language-server typescript
# One server for the whole library, which is how it prefers loose files.
command = "typescript-language-server"
args = ["--stdio"]
workspace = "library_root"
# Written into the library the first time the server starts, and never again:
# without it, loose .ts files are checked as JavaScript with no DOM or Node
# types. Yours to edit afterwards.
# The server also needs a TypeScript to analyse with, and looks for one in the
# workspace: `npm install` once in your library folder is what provides it. See
# README.md.
workspace_files = [
  { path = "tsconfig.json", template = "tsconfig.json" },
  { path = "package.json", template = "library-package.json" },
]

[deps]
# Installs into the playground's own node_modules, next to its package.json.
kind = "command"
add = ["npm", "install", "{name}@{version}"]

[output]
# Node prints the error, then the stack. The first frame has the position:
#     TypeError: x is not a function
#         at file:///C:/play/main.ts:8:7
# Paths appear as file:// URLs for ES modules and as plain paths otherwise.
error_regex = '(?m)^(?<message>[A-Za-z]*(?:Error|Warning)(?: \[[A-Za-z_]+\])?:.*)\n\s*at (?:[^()\n]*\()?(?:file:///)?(?<file>[^()\n]+?):(?<line>\d+):(?<col>\d+)\)?$'
error_regex_multiline = true

[run]
# --experimental-transform-types: strip types, and also compile `enum` and
#   `namespace`. Line numbers are preserved, so stack traces point at main.ts.
# --require register.cjs: makes `import { dump } from "tinkerpad"` resolve to
#   dump/tinkerpad.js. (NODE_PATH doesn't apply to ES modules, and --import
#   can't take a Windows path.)
command = "{toolchain}"
args = [
  "--experimental-transform-types",
  "--disable-warning=ExperimentalWarning",
  "--require",
  "{plugin_dir}/dump/register.cjs",
  "{main}",
]

[helper]
# The warm runner (docs/PLUGINS.md §5, work item 03-06). No build step: it is
# one file of JavaScript, started with the same Node and the same flags a run
# gets, so a playground behaves identically either way.
#
# Every flag is here rather than inside the script, which is what lets Phase 6
# add `--inspect=0` without touching the helper (docs/DEBUGGING.md D10).
command = "{toolchain}"
args = [
  "--experimental-transform-types",
  "--disable-warning=ExperimentalWarning",
  "--require",
  "{plugin_dir}/dump/register.cjs",
  "{plugin_dir}/helper/helper.mjs",
]
hooks = ["run"]
# Node is cheap to start again; half an hour of not being used is enough.
idle_shutdown = "30m"
