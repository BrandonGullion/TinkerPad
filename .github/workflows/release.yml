# Release bundles, from one tag (work item 04-06).
#
# Push a tag like `v0.2.0` and this builds an installer per platform, signs the
# update manifests with the repository's updater key, and puts everything on a
# draft GitHub release. The draft is deliberate: nothing is published until a
# person has looked at what was built.
#
# The bundles are not code-signed. On macOS that means Gatekeeper asks the user
# to confirm the first launch (see README); adding an Apple Developer ID later
# is a matter of adding secrets and four lines here, not a rebuild of this.

name: Release

on:
  push:
    tags: ["v*"]
  # Useful for trying the build without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and the bundling tools the AppImage and .deb need.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file desktop-file-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update manifests, so an installed TinkerPad will accept
          # what this build produces. Without these the bundles still build;
          # the updater just has nothing it trusts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/tinkerpad-app
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: TinkerPad ${{ github.ref_name }}
          releaseBody: |
            Installers for Windows, macOS and Linux are attached.

            macOS: the app is not signed with an Apple Developer ID, so the
            first launch needs right-click → Open (see the README).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  # Linux on arm64, best effort: a native runner rather than a cross build,
  # because WebKitGTK does not cross-compile pleasantly. A failure here does
  # not hold up the release.
  linux-arm64:
    name: Linux arm64 (best effort)
    runs-on: ubuntu-22.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file desktop-file-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/tinkerpad-app
          tagName: ${{ github.ref_name }}
          releaseName: TinkerPad ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
