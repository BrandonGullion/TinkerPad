name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The Tauri app embeds ui/dist, so build the UI before any cargo step.
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # Lets the library test move a playground to the real recycle bin.
        env:
          TINKERPAD_TEST_TRASH: "1"
        run: cargo test --workspace

      - name: Platform-code lint
        shell: bash
        run: bash scripts/lint-platform-cfg.sh

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      - name: Build
        working-directory: ui
        run: npm run build

  launch:
    name: Launch smoke test (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build app (debug, assets embedded)
        run: |
          npm --prefix ui ci
          ui/node_modules/.bin/tauri build --debug --no-bundle

      # A user plugin folder with one valid and one broken plugin, so the
      # plugins self-test exercises discovery, skipping, and the startup toast.
      - name: Prepare test user plugins
        run: |
          mkdir -p "$RUNNER_TEMP/user-plugins"
          cp -r crates/tinkerpad-plugin/tests/fixtures/valid/minimal "$RUNNER_TEMP/user-plugins/mini"
          cp -r crates/tinkerpad-plugin/tests/fixtures/valid/node-check "$RUNNER_TEMP/user-plugins/node-check"
          cp -r crates/tinkerpad-plugin/tests/fixtures/invalid/unknown-key "$RUNNER_TEMP/user-plugins/broken-typo"

      - name: Launch (Linux)
        if: runner.os == 'Linux'
        env:
          TINKERPAD_SELFTEST: layout,run,dump,plugins,toolchains,library,library-trash,locked
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/library
        run: |
          set -o pipefail
          xvfb-run -a bash scripts/smoke-launch.sh target/debug/tinkerpad 120 | tee launch.log
          grep -q "selftest: INFO plugins loaded=2 failures=1" launch.log
          grep -q "selftest: PASS real toolchain probes as ready" launch.log
          grep -q "selftest: PASS rename moves the folder and keeps the id" launch.log
          grep -q "selftest: PASS delete removes the playground" launch.log
          grep -q "selftest: PASS select-all + delete leaves the locked lines" launch.log
          grep -q "selftest: PASS dumped values arrive in order with the text around them" launch.log

      - name: Launch (macOS)
        if: runner.os == 'macOS'
        env:
          TINKERPAD_SELFTEST: layout,run,dump,plugins,toolchains,library,library-trash,locked
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/library
        run: |
          set -o pipefail
          bash scripts/smoke-launch.sh target/debug/tinkerpad 120 | tee launch.log
          grep -q "selftest: INFO plugins loaded=2 failures=1" launch.log
          grep -q "selftest: PASS real toolchain probes as ready" launch.log
          grep -q "selftest: PASS rename moves the folder and keeps the id" launch.log
          grep -q "selftest: PASS delete removes the playground" launch.log
          grep -q "selftest: PASS select-all + delete leaves the locked lines" launch.log
          grep -q "selftest: PASS dumped values arrive in order with the text around them" launch.log
