name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No first-run banner or telemetry from the .NET CLI.
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The C# plugin tests run real .NET 10 file-based apps.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The first `dotnet` on a fresh runner does its one-time setup, which can
      # outlast the plugin's 3 s toolchain probe, and several tests starting it
      # at once collide over that setup's lock. Doing it once here, alone,
      # means the tests only ever meet a dotnet that is already set up.
      - name: Warm up .NET
        run: dotnet --info

      # The Python plugin needs 3.11 or newer, which is newer than some runner
      # images ship, and basedpyright for its language server (03-04).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare the Python language server
        run: pip install basedpyright

      # The Tauri app embeds ui/dist, so build the UI before any cargo step.
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # Lets the library test move a playground to the real recycle bin.
        env:
          TINKERPAD_TEST_TRASH: "1"
        run: cargo test --workspace

      - name: Platform-code lint
        shell: bash
        run: bash scripts/lint-platform-cfg.sh

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      # docs/KEYBINDINGS.md is generated from the command catalog (04-03);
      # a keymap change that doesn't update it fails here.
      - name: Keybindings doc is current
        working-directory: ui
        run: npm run docs:keys:check
      - name: Build
        working-directory: ui
        run: npm run build

  launch:
    name: Launch smoke test (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The first `dotnet` on a fresh runner does its one-time setup, which can
      # outlast the plugin's 3 s toolchain probe, and several tests starting it
      # at once collide over that setup's lock. Doing it once here, alone,
      # means the tests only ever meet a dotnet that is already set up.
      - name: Warm up .NET
        run: dotnet --info

      # The Python plugin needs 3.11 or newer, which is newer than some runner
      # images ship, and basedpyright for its language server (03-04).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare the Python language server
        run: pip install basedpyright

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Rust plugin's language server, for the `lsp` scenario (02-04).
          components: rust-analyzer

      - uses: Swatinem/rust-cache@v2

      - name: Build app (debug, assets embedded)
        run: |
          npm --prefix ui ci
          ui/node_modules/.bin/tauri build --debug --no-bundle

      # A user plugin folder with one valid and one broken plugin, so the
      # plugins self-test exercises discovery, skipping, and the startup toast.
      - name: Prepare test user plugins
        run: |
          mkdir -p "$RUNNER_TEMP/user-plugins"
          cp -r crates/tinkerpad-plugin/tests/fixtures/valid/minimal "$RUNNER_TEMP/user-plugins/mini"
          cp -r crates/tinkerpad-plugin/tests/fixtures/valid/node-check "$RUNNER_TEMP/user-plugins/node-check"
          cp -r crates/tinkerpad-plugin/tests/fixtures/invalid/unknown-key "$RUNNER_TEMP/user-plugins/broken-typo"

      # The TypeScript language server, and a TypeScript for it to analyse
      # with in the library it is rooted at (02-07).
      - name: Prepare the TypeScript language server
        run: |
          npm install -g typescript-language-server
          mkdir -p "$RUNNER_TEMP/library"
          cp plugins/typescript/templates/library-package.json "$RUNNER_TEMP/library/package.json"
          npm --prefix "$RUNNER_TEMP/library" install

      - name: Launch (Linux)
        if: runner.os == 'Linux'
        env:
          TINKERPAD_SELFTEST: layout,run,plugins,toolchains,dump,dump-render,typescript,csharp,rust,python,library,library-trash,locked,tabs,annotations,packages
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/library
        run: |
          set -o pipefail
          xvfb-run -a bash scripts/smoke-launch.sh target/debug/tinkerpad 600 | tee launch.log
          grep -q "selftest: INFO plugins loaded=5 failures=1" launch.log
          grep -q "selftest: PASS real toolchain probes as ready" launch.log
          grep -q "selftest: PASS rename moves the folder and keeps the id" launch.log
          grep -q "selftest: PASS delete removes the playground" launch.log
          grep -q "selftest: PASS select-all + delete leaves the locked lines" launch.log
          grep -q "selftest: PASS dumped values arrive in order with the text around them" launch.log
          grep -q "selftest: PASS a 10,000-row table is virtualised" launch.log
          grep -q "selftest: PASS the template.s dump renders a table" launch.log
          grep -q "selftest: PASS the template.s .Dump() renders a table" launch.log
          grep -q "selftest: PASS a second playground builds and runs" launch.log
          grep -q "selftest: PASS two runs share one interpreter" launch.log
          grep -q "selftest: PASS a traceback is reported, and its line marked" launch.log
          grep -q "selftest: PASS Mod+N creates an Untitled playground" launch.log
          grep -q "selftest: PASS a dirty tab asks, and Keep mine saves" launch.log
          grep -q "selftest: PASS the error is marked in the editor at its line and column" launch.log
          grep -q "selftest: PASS the directive goes on the first line" launch.log

      # A fresh session for the language-server scenarios: rust-analyzer is
      # sensitive to a session that has already created and deleted a dozen
      # Rust playgrounds (see work item 02-07).
      - name: Language servers (Linux)
        if: runner.os == 'Linux'
        env:
          TINKERPAD_SELFTEST: lsp,lsp-typescript,prewarm,servers,definition,helpers,helper-run
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/library
          TINKERPAD_LSP_PREWARM: node-check
        run: |
          set -o pipefail
          xvfb-run -a bash scripts/smoke-launch.sh target/debug/tinkerpad 600 | tee lsp.log
          grep -q "selftest: PASS the tab is usable straight away" lsp.log
          grep -q "selftest: PASS both Rust playgrounds are served by one process" lsp.log
          grep -q "selftest: PASS completions on an array come from the server" lsp.log
          grep -q "selftest: PASS a pinned language server is up" lsp.log
          grep -q "selftest: PASS a language server shows up in the status bar" lsp.log
          grep -q "selftest: PASS Restart brings it back" lsp.log
          grep -q "selftest: PASS a definition in another file opens a read-only tab" lsp.log
          grep -q "selftest: PASS at most ten read-only tabs are kept" lsp.log
          grep -q "selftest: PASS a helper starts on demand, building itself first" lsp.log
          grep -q "selftest: PASS and starting it again doesn.t rebuild it" lsp.log
          grep -q "selftest: PASS a run on a plugin helper says so in the status bar" lsp.log
          grep -q "selftest: PASS a second playground waits for the helper" lsp.log
          grep -q "selftest: PASS and the user is told what is being used instead" lsp.log

      # Every bundled plugin, through the same loader, scaffolder and runner the
      # app uses (work items 05-01a, 05-01b). A toolchain this runner hasn't
      # got is a skip, not a failure, so this stays useful as languages are
      # added to the matrix rather than becoming a list of exclusions.
      # The reference pages are generated from the types (work item 05-04), so
      # a type that changed without them is a failed build rather than a stale
      # page nobody noticed.
      # The plugin index, and the schema generated from the types that read it
      # (work item 05-05).
      - name: Plugin index is sound
        shell: bash
        run: |
          tinkerpad=target/debug/tinkerpad
          [ -x "$tinkerpad" ] || tinkerpad=target/debug/tinkerpad.exe
          "$tinkerpad" registry check registry/index.json
          "$tinkerpad" registry schema registry/index.schema.json --check

      - name: Reference pages are current
        shell: bash
        run: cargo run -q -p tinkerpad-plugin --bin tinkerpad-docgen -- --check

      # The documentation site builds. Publishing it is a later step, for when
      # the repository is public; this is the half that can fail on a typo.
      - name: Documentation site builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install mdbook --locked --version ^0.4 || true
          mdbook build docs

      - name: Plugin conformance
        shell: bash
        run: |
          set -o pipefail
          tinkerpad=target/debug/tinkerpad
          [ -x "$tinkerpad" ] || tinkerpad=target/debug/tinkerpad.exe
          failed=0
          # The template is checked with the bundled plugins: it is what a
          # contributor starts from, so it has to pass before they touch it
          # (work item 05-03).
          for dir in plugins/*/ plugin-template/; do
            echo "== $dir"
            "$tinkerpad" plugin check "$dir" || failed=1
          done
          exit $failed

      - name: Session restore across two launches (Linux)
        if: runner.os == 'Linux'
        env:
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/session-library
          TINKERPAD_SESSION: ${{ runner.temp }}/session.json
        run: |
          set -o pipefail
          TINKERPAD_SELFTEST=session-prepare xvfb-run -a bash scripts/smoke-launch.sh target/debug/tinkerpad 120 | tee prepare.log
          TINKERPAD_SELFTEST=session-restore xvfb-run -a bash scripts/smoke-launch.sh target/debug/tinkerpad 120 | tee restore.log
          grep -q "selftest: PASS the last session.s tabs reopen at launch" restore.log

      - name: Launch (macOS)
        if: runner.os == 'macOS'
        env:
          TINKERPAD_SELFTEST: layout,run,plugins,toolchains,dump,dump-render,typescript,csharp,rust,python,library,library-trash,locked,tabs,annotations,packages
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/library
        run: |
          set -o pipefail
          bash scripts/smoke-launch.sh target/debug/tinkerpad 600 | tee launch.log
          grep -q "selftest: INFO plugins loaded=5 failures=1" launch.log
          grep -q "selftest: PASS real toolchain probes as ready" launch.log
          grep -q "selftest: PASS rename moves the folder and keeps the id" launch.log
          grep -q "selftest: PASS delete removes the playground" launch.log
          grep -q "selftest: PASS select-all + delete leaves the locked lines" launch.log
          grep -q "selftest: PASS dumped values arrive in order with the text around them" launch.log
          grep -q "selftest: PASS a 10,000-row table is virtualised" launch.log
          grep -q "selftest: PASS the template.s dump renders a table" launch.log
          grep -q "selftest: PASS the template.s .Dump() renders a table" launch.log
          grep -q "selftest: PASS a second playground builds and runs" launch.log
          grep -q "selftest: PASS two runs share one interpreter" launch.log
          grep -q "selftest: PASS a traceback is reported, and its line marked" launch.log
          grep -q "selftest: PASS Mod+N creates an Untitled playground" launch.log
          grep -q "selftest: PASS a dirty tab asks, and Keep mine saves" launch.log
          grep -q "selftest: PASS the error is marked in the editor at its line and column" launch.log
          grep -q "selftest: PASS the directive goes on the first line" launch.log

      - name: Language servers (macOS)
        if: runner.os == 'macOS'
        env:
          TINKERPAD_SELFTEST: lsp,lsp-typescript,prewarm,servers,definition,helpers,helper-run
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/library
          TINKERPAD_LSP_PREWARM: node-check
        run: |
          set -o pipefail
          bash scripts/smoke-launch.sh target/debug/tinkerpad 600 | tee lsp.log
          grep -q "selftest: PASS the tab is usable straight away" lsp.log
          grep -q "selftest: PASS both Rust playgrounds are served by one process" lsp.log
          grep -q "selftest: PASS completions on an array come from the server" lsp.log
          grep -q "selftest: PASS a pinned language server is up" lsp.log
          grep -q "selftest: PASS a language server shows up in the status bar" lsp.log
          grep -q "selftest: PASS Restart brings it back" lsp.log
          grep -q "selftest: PASS a definition in another file opens a read-only tab" lsp.log
          grep -q "selftest: PASS at most ten read-only tabs are kept" lsp.log
          grep -q "selftest: PASS a helper starts on demand, building itself first" lsp.log
          grep -q "selftest: PASS and starting it again doesn.t rebuild it" lsp.log
          grep -q "selftest: PASS a run on a plugin helper says so in the status bar" lsp.log
          grep -q "selftest: PASS a second playground waits for the helper" lsp.log
          grep -q "selftest: PASS and the user is told what is being used instead" lsp.log

      - name: Session restore across two launches (macOS)
        if: runner.os == 'macOS'
        env:
          TINKERPAD_USER_PLUGINS: ${{ runner.temp }}/user-plugins
          TINKERPAD_LIBRARY: ${{ runner.temp }}/session-library
          TINKERPAD_SESSION: ${{ runner.temp }}/session.json
        run: |
          set -o pipefail
          TINKERPAD_SELFTEST=session-prepare bash scripts/smoke-launch.sh target/debug/tinkerpad 120 | tee prepare.log
          TINKERPAD_SELFTEST=session-restore bash scripts/smoke-launch.sh target/debug/tinkerpad 120 | tee restore.log
          grep -q "selftest: PASS the last session.s tabs reopen at launch" restore.log
