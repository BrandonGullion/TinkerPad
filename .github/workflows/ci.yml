name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No first-run banner or telemetry from the .NET CLI.
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The C# plugin tests run real .NET 10 file-based apps.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The first `dotnet` on a fresh runner does its one-time setup (NuGet
      # migrations under a named lock), which can outlast the plugin's 3 s
      # toolchain probe, and several tests starting it at once collide over
      # that lock. Doing it once here, alone, means the tests only ever meet a
      # dotnet that is already set up. `--info` and `--version` skip that setup,
      # so they don't count; a real command does.
      - name: Warm up .NET
        run: |
          dotnet --info
          dotnet nuget locals all --list

      # The Python plugin needs 3.11 or newer, which is newer than some runner
      # images ship, and basedpyright for its language server (03-04).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare the Python language server
        run: pip install basedpyright

      # The Tauri app embeds ui/dist, so build the UI before any cargo step.
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # Lets the library test move a playground to the real recycle bin.
        env:
          TINKERPAD_TEST_TRASH: "1"
        run: cargo test --workspace

      - name: Platform-code lint
        shell: bash
        run: bash scripts/lint-platform-cfg.sh

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      # docs/KEYBINDINGS.md is generated from the command catalog (04-03);
      # a keymap change that doesn't update it fails here.
      - name: Keybindings doc is current
        working-directory: ui
        run: npm run docs:keys:check
      - name: Build
        working-directory: ui
        run: npm run build
